<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Trip | OuterGuide</title>

    <!-- CONNECTS THIS PAGE TO CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            <h1>OuterGuide</h1>
        </div>

        <nav>

            <ul>

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About Us</a>
                </li>

                <li>
                    <a href="services.html">Services</a>
                </li>

                <li>
                    <a href="enquiries.html" class="active">Enquiries</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- MAIN -->

    <main>

        <section class="enquiry-form-section">

            <h2>Start Your Journey</h2>

            <p>
                Tell us a little bit about your dream trip, and our
                travel experts will get back to you within 24 hours
                with a custom proposal.
            </p>


            <form class="enquiry-form" action="#" method="POST">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="John Doe"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="john@example.com"
                    required
                >


                <label for="destination">
                    Desired Destination
                </label>

                <input
                    type="text"
                    id="destination"
                    name="destination"
                    placeholder="e.g., Kyoto, Japan"
                >


                <label for="dates">
                    Estimated Travel Dates
                </label>

                <input
                    type="text"
                    id="dates"
                    name="dates"
                    placeholder="e.g., October 2026"
                >


                <label for="details">
                    Tell us about your ideal trip
                </label>

                <textarea
                    id="details"
                    name="details"
                    rows="5"
                    placeholder="What are you hoping to see and do?"
                ></textarea>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Send Enquiry
                </button>


            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-content">

            <p>
                &copy; 2026 OuterGuide Travel Agency.
                All rights reserved.
            </p>

        </div>

    </footer>


</body>
</html>
